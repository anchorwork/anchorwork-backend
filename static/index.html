
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coder Agent UI</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 2rem; }
        textarea { width: 100%; height: 10rem; margin-top: 1rem; font-family: monospace; }
        input[type="text"] { width: 100%; padding: 1rem; font-size: 1.1rem; }
        button { padding: 0.75rem 2rem; font-size: 1rem; margin-top: 1rem; }
        #output { white-space: pre-wrap; background: #fff; padding: 1rem; border: 1px solid #ccc; height: 20rem; overflow-y: scroll; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>💻 Talk to the Coder Agent</h1>
    <input type="text" id="prompt" placeholder="e.g., Initialize session">
    <button onclick="sendPrompt()">Send</button>
    <div id="output"></div>

    <script>
        async function sendPrompt() {
            const prompt = document.getElementById('prompt').value;
            const response = await fetch('/coder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });
            const result = await response.json();
            document.getElementById('output').textContent = result.response;
        }
    </script>
</body>
</html>
